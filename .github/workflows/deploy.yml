name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages.
#
# @vanduo-oss/vd3 and @vanduo-oss/vd3-cbun are published on npm, so
# `pnpm install` resolves them cleanly on the runner. The default Vite `base`
# is `/scriptman-fighters/` (a GitHub Pages project site); override with the
# VITE_BASE env var for a user/organization site or a custom domain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
