<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scriptman Fighters</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A fighting game where you write JavaScript to control AI fighters" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:;" />
  <link rel="stylesheet" href="%BASE_URL%icons/phosphor/duotone/style.css" />
  <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
  <script>
    (function () {
      try {
        var p = localStorage.getItem('vanduo-theme-preference') || localStorage.getItem('kpc-theme');
        if (p === 'light' || p === 'dark') {
          document.documentElement.setAttribute('data-theme', p);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
